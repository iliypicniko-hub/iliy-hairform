<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iliy ヘアメイクアンケート</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7F2; --warm-white: #FFFEFB; --dark: #1C1A18; --muted: #7A7570;
    --accent: #C4956A; --accent-light: #F0E6D8; --border: #E8E0D5;
    --success: #5A8A6A; --error: #C46A6A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--dark); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; min-height: 100vh; }
  .header { background: var(--warm-white); border-bottom: 1px solid var(--border); padding: 18px 24px; text-align: center; }
  .header-title { font-size: 18px; font-weight: 500; letter-spacing: 0.08em; }
  .header-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .progress-wrap { background: var(--warm-white); padding: 14px 24px 0; border-bottom: 1px solid var(--border); }
  .progress-steps { display: flex; justify-content: center; max-width: 560px; margin: 0 auto; }
  .step-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; }
  .step-item:not(:last-child)::after { content:''; position:absolute; top:13px; left:50%; width:100%; height:1px; background:var(--border); z-index:0; }
  .step-item.done:not(:last-child)::after, .step-item.active:not(:last-child)::after { background: var(--accent); }
  .step-dot { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border); background:var(--warm-white); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--muted); position:relative; z-index:1; transition:all 0.3s; }
  .step-item.active .step-dot { border-color:var(--accent); background:var(--accent); color:white; }
  .step-item.done .step-dot { border-color:var(--accent); background:var(--accent-light); color:var(--accent); }
  .step-label { font-size:9px; color:var(--muted); margin-top:5px; white-space:nowrap; padding-bottom:10px; }
  .step-item.active .step-label { color:var(--accent); font-weight:500; }
  .main { max-width: 560px; margin: 0 auto; padding: 28px 20px 60px; }
  .page { display: none; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .page-heading { font-size: 21px; font-weight: 500; margin-bottom: 6px; }
  .page-desc { font-size: 13px; color: var(--muted); margin-bottom: 26px; line-height: 1.8; }
  .section-badge { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 500; margin-bottom: 16px; letter-spacing: 0.05em; }
  .section-badge.female { background: #FBEAF0; color: #993556; border: 1px solid #ED93B1; }
  .section-badge.male { background: #E6F1FB; color: #185FA5; border: 1px solid #85B7EB; }
  .notice-box { background:var(--accent-light); border-left:3px solid var(--accent); border-radius:0 8px 8px 0; padding:12px 14px; font-size:12px; line-height:1.8; margin-bottom:24px; color:var(--dark); }
  .notice-box strong { color:var(--accent); font-weight:500; }
  .notice-box.both { background: #EAF3DE; border-left-color: #3B6D11; }
  .notice-box.both strong { color: #3B6D11; }
  .field { margin-bottom: 22px; }
  .field label { display:block; font-size:13px; font-weight:500; margin-bottom:8px; color:var(--dark); }
  .field label .req { color:var(--accent); margin-left:4px; font-size:10px; }
  .field label .opt { color:var(--muted); margin-left:4px; font-size:10px; font-weight:300; }
  input[type="text"], input[type="date"], textarea { width:100%; background:var(--warm-white); border:1px solid var(--border); border-radius:8px; padding:11px 13px; font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:300; color:var(--dark); outline:none; transition:border-color 0.2s; }
  input[type="text"]:focus, input[type="date"]:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:90px; line-height:1.7; }
  .radio-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .radio-grid.col1 { grid-template-columns:1fr; }
  .radio-grid.col3 { grid-template-columns:1fr 1fr 1fr; }
  .choice-card { position:relative; cursor:pointer; }
  .choice-card input { position:absolute; opacity:0; width:0; height:0; }
  .choice-label { display:flex; align-items:center; gap:9px; padding:11px 13px; background:var(--warm-white); border:1px solid var(--border); border-radius:8px; font-size:13px; transition:all 0.2s; cursor:pointer; line-height:1.4; }
  .choice-card input:checked + .choice-label { border-color:var(--accent); background:var(--accent-light); }
  .choice-dot { width:15px; height:15px; border-radius:50%; border:1.5px solid var(--border); flex-shrink:0; transition:all 0.2s; display:flex; align-items:center; justify-content:center; }
  .choice-card input:checked + .choice-label .choice-dot { border-color:var(--accent); background:var(--accent); }
  .choice-card input:checked + .choice-label .choice-dot::after { content:''; width:5px; height:5px; border-radius:50%; background:white; }
  .upload-area { border:1.5px dashed var(--border); border-radius:10px; padding:24px 16px; text-align:center; background:var(--warm-white); cursor:pointer; transition:all 0.2s; position:relative; }
  .upload-area:hover { border-color:var(--accent); background:var(--accent-light); }
  .upload-area input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
  .upload-icon { font-size:24px; margin-bottom:8px; opacity:0.5; }
  .upload-text { font-size:12px; color:var(--muted); line-height:1.7; }
  .upload-text strong { color:var(--accent); font-weight:500; }
  .photo-previews { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .photo-thumb { aspect-ratio:1; border-radius:8px; overflow:hidden; position:relative; border:1px solid var(--border); }
  .photo-thumb img { width:100%; height:100%; object-fit:cover; }
  .photo-remove { position:absolute; top:4px; right:4px; width:20px; height:20px; background:rgba(0,0,0,0.5); border-radius:50%; border:none; color:white; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .nav { display:flex; gap:10px; margin-top:32px; }
  .btn-back { flex:0 0 auto; padding:13px 18px; background:transparent; border:1px solid var(--border); border-radius:8px; font-family:'Noto Sans JP',sans-serif; font-size:13px; color:var(--muted); cursor:pointer; transition:all 0.2s; }
  .btn-back:hover { border-color:var(--muted); color:var(--dark); }
  .btn-next { flex:1; padding:13px; background:var(--dark); border:none; border-radius:8px; font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:500; color:white; cursor:pointer; transition:all 0.2s; }
  .btn-next:hover { background:var(--accent); }
  .btn-submit { flex:1; padding:13px; background:var(--accent); border:none; border-radius:8px; font-family:'Noto Sans JP',sans-serif; font-size:14px; font-weight:500; color:white; cursor:pointer; transition:all 0.2s; }
  .btn-submit:hover { background:#B8845A; }
  .btn-submit:disabled { background:var(--muted); cursor:not-allowed; }
  .confirm-block { background:var(--warm-white); border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .confirm-block-title { background:var(--accent-light); padding:9px 15px; font-size:11px; font-weight:500; color:var(--accent); letter-spacing:0.08em; border-bottom:1px solid var(--border); }
  .confirm-block-title.male { background:#E6F1FB; color:#185FA5; }
  .confirm-row { padding:10px 15px; display:flex; gap:12px; border-bottom:1px solid var(--border); font-size:13px; }
  .confirm-row:last-child { border-bottom:none; }
  .confirm-key { color:var(--muted); flex:0 0 130px; font-size:12px; }
  .confirm-val { color:var(--dark); flex:1; line-height:1.6; }
  .thankyou { text-align:center; padding:48px 20px; }
  .thankyou-icon { width:60px; height:60px; border-radius:50%; background:var(--accent-light); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; margin:0 auto 18px; font-size:22px; }
  .thankyou h2 { font-size:21px; font-weight:500; margin-bottom:12px; }
  .thankyou p { font-size:13px; color:var(--muted); line-height:2; }
  .sending-overlay { display:none; position:fixed; inset:0; background:rgba(255,255,255,0.85); z-index:100; align-items:center; justify-content:center; flex-direction:column; gap:16px; }
  .sending-overlay.show { display:flex; }
  .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sending-text { font-size:13px; color:var(--muted); }
  .error-msg { font-size:12px; color:var(--error); margin-top:6px; display:none; }
  .error-msg.show { display:block; }

  /* ADMIN */
  .admin-wrap { max-width:700px; margin:0 auto; padding:24px 20px 60px; }
  .loading-box { text-align:center; padding:60px 0; color:var(--muted); font-size:14px; }
  .dashboard { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:32px; }
  .dash-card { background:var(--warm-white); border:1px solid var(--border); border-radius:14px; padding:24px 20px; cursor:pointer; transition:all 0.2s; }
  .dash-card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .dash-card.new { border-left:4px solid var(--accent); }
  .dash-card.done { border-left:4px solid var(--border); }
  .dash-count { font-size:42px; font-weight:500; line-height:1; margin-bottom:8px; }
  .dash-card.new .dash-count { color:var(--accent); }
  .dash-card.done .dash-count { color:var(--muted); }
  .dash-label { font-size:14px; font-weight:500; color:var(--dark); margin-bottom:4px; }
  .dash-sub { font-size:11px; color:var(--muted); }
  .list-header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .btn-back-list { padding:8px 14px; background:transparent; border:1px solid var(--border); border-radius:8px; font-family:'Noto Sans JP',sans-serif; font-size:12px; color:var(--muted); cursor:pointer; transition:all 0.2s; }
  .btn-back-list:hover { border-color:var(--muted); color:var(--dark); }
  .list-title { font-size:16px; font-weight:500; color:var(--dark); }
  .admin-card { background:var(--warm-white); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:20px; }
  .admin-card-head { background:var(--accent-light); padding:13px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
  .admin-card-name { font-size:16px; font-weight:500; }
  .admin-card-meta { font-size:11px; color:var(--muted); }
  .admin-card-body { padding:16px 18px; }
  .admin-section-title { font-size:11px; font-weight:500; letter-spacing:0.06em; margin:14px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--border); }
  .admin-section-title.female { color:#993556; }
  .admin-section-title.male { color:#185FA5; }
  .admin-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px 20px; font-size:13px; margin-bottom:10px; }
  .admin-fl { font-size:11px; color:var(--muted); margin-bottom:2px; }
  .admin-photos { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
  .admin-photo { aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); cursor:pointer; }
  .admin-photo img { width:100%; height:100%; object-fit:cover; }
  .share-box { background:var(--cream); border:1px solid var(--border); border-radius:10px; padding:13px 15px; margin-top:14px; }
  .share-title { font-size:11px; font-weight:500; color:var(--muted); margin-bottom:9px; }
  .share-row { display:flex; gap:8px; align-items:center; }
  .share-url-text { font-size:11px; color:var(--muted); background:var(--warm-white); border:1px solid var(--border); border-radius:6px; padding:6px 10px; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn-copy { padding:6px 14px; background:var(--dark); border:none; border-radius:6px; font-family:'Noto Sans JP',sans-serif; font-size:11px; color:white; cursor:pointer; white-space:nowrap; transition:all 0.2s; }
  .btn-copy:hover { background:var(--accent); }
  .btn-copy.copied { background:var(--success); }
  .badge-new { display:inline-block; background:var(--accent); color:white; font-size:10px; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; }

  /* SALON */
  .salon-wrap-inner { max-width:600px; margin:0 auto; padding:24px 20px 60px; }
  .salon-card { background:var(--warm-white); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .salon-head { background:var(--accent-light); padding:18px 20px; border-bottom:1px solid var(--border); }
  .salon-name { font-size:20px; font-weight:500; margin-bottom:4px; }
  .salon-meta { font-size:12px; color:var(--muted); }
  .salon-body { padding:20px; }
  .salon-section { margin-bottom:22px; }
  .salon-sec-title { font-size:11px; font-weight:500; letter-spacing:0.08em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .salon-sec-title.female { color:#993556; }
  .salon-sec-title.male { color:#185FA5; }
  .salon-sec-title.common { color:var(--accent); }
  .salon-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .salon-fl { color:var(--muted); font-size:11px; margin-bottom:3px; }
  .salon-fv { font-size:13px; color:var(--dark); }
  .salon-photos { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .salon-photo { aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); cursor:pointer; }
  .salon-photo img { width:100%; height:100%; object-fit:cover; transition:opacity 0.2s; }
  .salon-photo img:hover { opacity:0.85; }
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:90vw; max-height:90vh; border-radius:8px; }
  .lightbox-close { position:absolute; top:16px; right:20px; font-size:28px; color:white; cursor:pointer; line-height:1; }
</style>
</head>
<body>

<div class="sending-overlay" id="sending-overlay">
  <div class="spinner"></div>
  <div class="sending-text">送信中です。しばらくお待ちください…</div>
</div>

<!-- CLIENT FORM -->
<div id="client-app">
  <div class="header">
    <div class="header-title">iliy ヘアメイクに関するアンケート</div>
    <div class="header-sub">撮影日の7日前までにご回答ください</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-steps" id="progress-steps"></div>
  </div>
  <div class="main" id="form-main"></div>
</div>

<!-- ADMIN -->
<div id="admin-app" style="display:none">
  <div class="header">
    <div class="header-title">管理画面 — 回答一覧</div>
    <div class="header-sub" id="admin-sub">読み込み中…</div>
  </div>
  <div class="admin-wrap" id="admin-wrap"><div class="loading-box">読み込み中…</div></div>
</div>

<!-- SALON VIEW -->
<div id="salon-app" style="display:none">
  <div class="header">
    <div class="header-title">ヘアメイク担当者 様</div>
    <div class="header-sub">事前アンケート</div>
  </div>
  <div class="salon-wrap-inner" id="salon-wrap"><div class="loading-box">読み込み中…</div></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close">✕</span>
  <img id="lightbox-img" src="">
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbyar4qcJAG0fjg3jTpTOL4kCbayUb9xIUEv5AVTj42HrxxuDc3iIf7sWvE5OBG653b5/exec';

async function apiPost(body) {
  const res = await fetch(API, { method:'POST', body:JSON.stringify(body) });
  return res.json();
}
async function apiGet(params) {
  const res = await fetch(API + '?' + new URLSearchParams(params));
  return res.json();
}

// ============================================================
// ROUTING
// ============================================================
const urlParams = new URLSearchParams(location.search);
const mode = urlParams.get('mode');
const sid  = urlParams.get('sid');

if (sid) {
  document.getElementById('client-app').style.display = 'none';
  document.getElementById('salon-app').style.display = 'block';
  initSalonView(sid);
} else if (mode === 'admin') {
  document.getElementById('client-app').style.display = 'none';
  document.getElementById('admin-app').style.display = 'block';
  initAdmin();
} else {
  initForm();
}

// ============================================================
// FORM STATE
// ============================================================
let optionType = ''; // 'female', 'male', 'both'
let currentStep = 0;
const photoStore = {
  'f-hair-images':[], 'f-makeup-images':[], 'f-length-images':[],
  'm-hair-images':[], 'm-length-images':[]
};

// Step definitions per option type
function getSteps() {
  const common1 = ['option', 'basic'];
  const female = ['f-hair', 'f-makeup', 'f-photo'];
  const male   = ['m-hair', 'm-photo'];
  const confirm = ['confirm', 'done'];
  if (optionType === 'female') return [...common1, ...female, ...confirm];
  if (optionType === 'male')   return [...common1, ...male,   ...confirm];
  if (optionType === 'both')   return [...common1, ...female, ...male, ...confirm];
  return ['option', 'basic', 'confirm', 'done']; // fallback
}

function stepLabels(steps) {
  const map = {
    option:'オプション', basic:'基本情報',
    'f-hair':'女性ヘア', 'f-makeup':'女性メイク', 'f-photo':'女性写真',
    'm-hair':'男性ヘア', 'm-photo':'男性写真',
    confirm:'確認', done:'完了'
  };
  return steps.map(s => map[s] || s);
}

function updateProgress() {
  const steps = getSteps().filter(s => s !== 'done');
  const labels = stepLabels(steps);
  const wrap = document.getElementById('progress-steps');
  wrap.innerHTML = steps.map((s, i) => {
    const cls = i < currentStep ? 'done' : i === currentStep ? 'active' : '';
    return `<div class="step-item ${cls}" data-step="${i}">
      <div class="step-dot">${i+1}</div>
      <div class="step-label">${labels[i]}</div>
    </div>`;
  }).join('');
}

function initForm() {
  currentStep = 0;
  renderStep();
}

function renderStep() {
  updateProgress();
  const steps = getSteps();
  const step = steps[currentStep];
  const main = document.getElementById('form-main');
  main.innerHTML = buildPage(step);
  window.scrollTo({ top:0, behavior:'smooth' });
}

function goNext() {
  if (!validateCurrent()) return;
  const steps = getSteps();
  // If option selected, recalculate steps
  if (steps[currentStep] === 'option') {
    optionType = document.querySelector('input[name="option-type"]:checked')?.value || '';
    if (!optionType) return;
  }
  if (steps[currentStep] === steps[steps.length - 2]) {
    buildConfirmData();
  }
  currentStep++;
  renderStep();
}

function goBack() {
  if (currentStep > 0) { currentStep--; renderStep(); }
}

// ============================================================
// PAGE BUILDER
// ============================================================
function buildPage(step) {
  switch(step) {
    case 'option':   return pageOption();
    case 'basic':    return pageBasic();
    case 'f-hair':   return pageFHair();
    case 'f-makeup': return pageFMakeup();
    case 'f-photo':  return pageFPhoto();
    case 'm-hair':   return pageMHair();
    case 'm-photo':  return pageMPhoto();
    case 'confirm':  return pageConfirm();
    case 'done':     return pageDone();
    default: return '';
  }
}

function navBtns(isFirst, isLast) {
  if (isLast) return `<div class="nav"><button class="btn-submit" id="btn-submit" onclick="submitForm()">送信する</button></div>`;
  if (isFirst) return `<div class="nav"><button class="btn-next" onclick="goNext()">次へ　→</button></div>`;
  return `<div class="nav"><button class="btn-back" onclick="goBack()">← 戻る</button><button class="btn-next" onclick="goNext()">次へ　→</button></div>`;
}

function radioGroup(name, options, cols) {
  const gridClass = cols === 1 ? 'col1' : cols === 3 ? 'col3' : '';
  return `<div class="radio-grid ${gridClass}">${options.map(o =>
    `<label class="choice-card"><input type="radio" name="${name}" value="${o}"><div class="choice-label"><div class="choice-dot"></div>${o}</div></label>`
  ).join('')}</div>`;
}

function uploadField(key, label, desc, max, icon) {
  return `<div class="field">
    <label>${label}<span class="opt">最大${max}枚</span></label>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.7">${desc}</div>
    <div class="upload-area">
      <input type="file" accept="image/*" ${max > 1 ? 'multiple' : ''} onchange="handlePhotos(event,'${key}',${max})">
      <div class="upload-icon">${icon}</div>
      <div class="upload-text"><strong>タップして写真を選ぶ</strong><br>最大${max}枚</div>
    </div>
    <div class="photo-previews" id="pp-${key}"></div>
  </div>`;
}

function pageOption() {
  return `
    <div class="page-heading">オプションの確認</div>
    <div class="page-desc">今回ご予約いただいたヘアメイクオプションを選択してください。</div>
    <div class="field">
      <label>ヘアメイクオプション<span class="req">必須</span></label>

// ============================================================
// VALIDATION
// ============================================================
function validateCurrent() {
  const steps = getSteps();
  const step = steps[currentStep];
  // Save current inputs before validating
  buildConfirmData();

  let ok = true;
  const show = id => { const el = document.getElementById(id); if(el) { el.classList.add('show'); ok = false; } };
  const hide = id => { const el = document.getElementById(id); if(el) el.classList.remove('show'); };

  if (step === 'option') {
    if (!document.querySelector('input[name="option-type"]:checked')) show('err-option'); else hide('err-option');
  }
  if (step === 'basic') {
    if (!formData.name) show('err-name'); else hide('err-name');
    if (optionType === 'both' && !formData.nameMale) show('err-name-male'); else hide('err-name-male');
    if (!formData.shootDate) show('err-date'); else hide('err-date');
  }
  if (step === 'f-hair') {
    if (!formData.fHairLength) show('err-f-length'); else hide('err-f-length');
    if (!formData.fPerm) show('err-f-perm'); else hide('err-f-perm');
    if (!formData.fHairVolume) show('err-f-volume'); else hide('err-f-volume');
    if (!formData.fHairTexture) show('err-f-texture'); else hide('err-f-texture');
  }
  if (step === 'f-makeup') {
    if (!formData.fSkinType) show('err-f-skin'); else hide('err-f-skin');
    if (!formData.fContact) show('err-f-contact'); else hide('err-f-contact');
    if (!formData.fMakeupImage) show('err-f-makeup'); else hide('err-f-makeup');
  }
  if (step === 'm-hair') {
    if (!formData.mHairLength) show('err-m-length'); else hide('err-m-length');
    if (!formData.mPerm) show('err-m-perm'); else hide('err-m-perm');
    if (!formData.mHairVolume) show('err-m-volume'); else hide('err-m-volume');
    if (!formData.mHairTexture) show('err-m-texture'); else hide('err-m-texture');
  }
  return ok;
}

// ============================================================
// PHOTOS
// ============================================================
function handlePhotos(e, key, max) {
  Array.from(e.target.files).forEach(f => { if (photoStore[key].length < max) photoStore[key].push(f); });
  renderPreviews(key);
}
function renderPreviews(key) {
  const wrap = document.getElementById('pp-' + key);
  if (!wrap) return;
  wrap.innerHTML = '';
  photoStore[key].forEach((f, i) => {
    const url = URL.createObjectURL(f);
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${url}"><button class="photo-remove" onclick="removePhoto('${key}',${i})">✕</button>`;
    wrap.appendChild(div);
  });
}
function removePhoto(key, i) { photoStore[key].splice(i, 1); renderPreviews(key); }

// ============================================================
// SUBMIT
// ============================================================
async function submitForm() {
  const btn = document.getElementById('btn-submit');
  if (btn) btn.disabled = true;
  document.getElementById('sending-overlay').classList.add('show');

  try {
    const readFile = f => new Promise(resolve => {
      const r = new FileReader();
      r.onload = e => resolve(e.target.result);
      r.readAsDataURL(f);
    });
    const toB64 = async key => Promise.all(photoStore[key].map(readFile));

    const [fHairImgs, fMakeupImgs, fLengthImgs, mHairImgs, mLengthImgs] = await Promise.all([
      toB64('f-hair-images'), toB64('f-makeup-images'), toB64('f-length-images'),
      toB64('m-hair-images'), toB64('m-length-images'),
    ]);

    const result = await apiPost({
      action: 'submit',
      optionType,
      name:         formData.name,
      nameMale:     formData.nameMale,
      shootDate:    formData.shootDate,
      fHairLength:  formData.fHairLength,
      fPerm:        formData.fPerm,
      fHairVolume:  formData.fHairVolume,
      fHairTexture: formData.fHairTexture,
      fSkinType:    formData.fSkinType,
      fAllergyCosm: formData.fAllergyCosm,
      fContact:     formData.fContact,
      fMakeupImage: formData.fMakeupImage,
      mHairLength:  formData.mHairLength,
      mPerm:        formData.mPerm,
      mHairVolume:  formData.mHairVolume,
      mHairTexture: formData.mHairTexture,
      memo:         formData.memo,
      fHairImages:   fHairImgs,
      fMakeupImages: fMakeupImgs,
      fLengthImages: fLengthImgs,
      mHairImages:   mHairImgs,
      mLengthImages: mLengthImgs,
    });

    document.getElementById('sending-overlay').classList.remove('show');
    if (result.ok) {
      currentStep++;
      renderStep();
    } else {
      alert('送信に失敗しました。時間をおいて再度お試しください。\n' + (result.error||''));
      if (btn) btn.disabled = false;
    }
  } catch(err) {
    document.getElementById('sending-overlay').classList.remove('show');
    alert('通信エラーが発生しました。インターネット接続をご確認ください。');
    if (btn) btn.disabled = false;
  }
}

      <div style="font-size:11px;font-weight:500;color:var(--muted);margin-bottom:10px;letter-spacing:0.05em">お客様に送るURL</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span style="font-size:12px;color:var(--dark);background:var(--cream);border:1px solid var(--border);border-radius:6px;padding:8px 12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${clientUrl}</span>
        <button class="btn-copy" onclick="copyClientUrl('${clientUrl}',this)">コピー</button>
      </div>
    </div>
    <div class="dashboard">
      <div class="dash-card new" onclick="showList('new')">
        <div class="dash-count">${newItems.length}</div>
        <div class="dash-label">新着・未対応</div>
        <div class="dash-sub">URLをまだコピーしていない回答</div>
      </div>
      <div class="dash-card done" onclick="showList('done')">
        <div class="dash-count">${doneItems.length}</div>
        <div class="dash-label">対応済み</div>
        <div class="dash-sub">URLをコピー済みの回答</div>
      </div>
    </div>
    ${newItems.length === 0 ? '<p style="text-align:center;padding:20px 0;color:var(--muted);font-size:13px">新着の回答はありません</p>' : ''}`;
}

function copyClientUrl(url, btn) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'コピー完了!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
  });
}

function optionLabel(type) {
  if (type === 'female') return '女性ヘアセット＆メイク';
  if (type === 'male')   return '男性ヘアセット';
  if (type === 'both')   return '女性＋男性';
  return type || '';
}

function buildAdminPhotoSection(label, imgs) {
  if (!imgs || imgs.length === 0) return '';
  return `<div style="font-size:11px;color:var(--muted);margin:10px 0 6px">${label}（${imgs.length}枚）</div>
    <div class="admin-photos">${imgs.map(u => `<div class="admin-photo" onclick="openLightbox('${u}')" style="cursor:pointer"><img src="${u}" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>`).join('')}</div>`;
}

function buildCard(s) {
  const baseUrl = location.origin + location.pathname;
  const shareUrl = `${baseUrl}?sid=${s.id}`;
  const badge = !s.read ? '<span class="badge-new">NEW</span>' : '';
  const isFemale = s.optionType === 'female' || s.optionType === 'both';
  const isMale   = s.optionType === 'male'   || s.optionType === 'both';
  const isBoth   = s.optionType === 'both';

  let body = `<div class="admin-grid">
    <div><div class="admin-fl">オプション</div>${optionLabel(s.optionType)}</div>
    <div><div class="admin-fl">撮影日</div>${fmtDate(s.shootDate)}</div>
    ${isBoth ? `<div><div class="admin-fl">男性名</div>${s.nameMale||''}</div>` : ''}
  </div>`;

  if (isFemale) {
    body += `<div class="admin-section-title female">👩 女性ヘア・メイク</div>
    <div class="admin-grid">
      <div><div class="admin-fl">髪の長さ</div>${s.fHairLength||''}</div>
      <div><div class="admin-fl">パーマ</div>${s.fPerm||''}</div>
      <div><div class="admin-fl">毛量 / 髪質</div>${s.fHairVolume||''} / ${s.fHairTexture||''}</div>
      <div><div class="admin-fl">肌質</div>${s.fSkinType||''}</div>
      <div><div class="admin-fl">コンタクト</div>${s.fContact||''}</div>
      <div><div class="admin-fl">メイクイメージ</div>${s.fMakeupImage||''}</div>
      ${s.fAllergyCosm ? `<div><div class="admin-fl">肌荒れ化粧品</div>${s.fAllergyCosm}</div>` : ''}
    </div>
    ${buildAdminPhotoSection('ヘアセットイメージ', s.fHairImages)}
    ${buildAdminPhotoSection('メイクイメージ', s.fMakeupImages)}
    ${buildAdminPhotoSection('髪の長さ写真', s.fLengthImages)}`;
  }

  if (isMale) {
    body += `<div class="admin-section-title male">👨 男性ヘア</div>
    <div class="admin-grid">
      <div><div class="admin-fl">髪の長さ</div>${s.mHairLength||''}</div>
      <div><div class="admin-fl">パーマ</div>${s.mPerm||''}</div>
      <div><div class="admin-fl">毛量 / 髪質</div>${s.mHairVolume||''} / ${s.mHairTexture||''}</div>
    </div>
    ${buildAdminPhotoSection('ヘアセットイメージ', s.mHairImages)}
    ${buildAdminPhotoSection('髪の長さ写真', s.mLengthImages)}`;
  }

  if (s.memo) {
    body += `<div style="font-size:12px;color:var(--muted);margin-top:12px">メモ：<span style="color:var(--dark)">${s.memo}</span></div>`;
  }

  return `<div class="admin-card" id="card-${s.id}">
    <div class="admin-card-head">
      <div><span class="admin-card-name">${s.name} 様</span>${badge}</div>
      <div class="admin-card-meta">${fmtDateTime(s.submittedAt)}</div>
    </div>
    <div class="admin-card-body">
      ${body}
      <div class="share-box">
        <div class="share-title">美容室へ共有するURL（この予約専用）</div>
        <div class="share-row">
          <span class="share-url-text">${shareUrl}</span>
          <button class="btn-copy" onclick="copyUrl('${shareUrl}',this,'${s.id}')">コピー</button>
        </div>
      </div>
    </div>
  </div>`;
}

function showList(type) {
  const items = type === 'new' ? allSubmissions.filter(s => !s.read) : allSubmissions.filter(s => s.read);
  const title = type === 'new' ? '新着・未対応' : '対応済み';
  const wrap = document.getElementById('admin-wrap');
  const cards = items.length === 0
    ? '<p style="text-align:center;padding:40px 0;color:var(--muted);font-size:14px">該当する回答はありません</p>'
    : items.map(buildCard).join('');
  wrap.innerHTML = `<div class="list-header">
    <button class="btn-back-list" onclick="showDashboard()">← トップへ</button>
    <span class="list-title">${title}（${items.length}件）</span>
  </div>${cards}`;
}

function copyUrl(url, btn, id) {
  navigator.clipboard.writeText(url).then(() => {
    btn.textContent = 'コピー完了!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
    const card = btn.closest('.admin-card');
    if (card) { const b = card.querySelector('.badge-new'); if (b) b.remove(); }
    const s = allSubmissions.find(x => x.id === id);
    if (s) s.read = true;
    fetch(API, { method:'POST', body:JSON.stringify({ action:'markRead', id }) });
  });
}

// ============================================================
// SALON VIEW
// ============================================================
async function initSalonView(id) {
  const wrap = document.getElementById('salon-wrap');
  try {
    const result = await apiGet({ action:'getOne', id });
    if (!result.ok) throw new Error(result.error);
    const s = result.data;
    const isFemale = s.optionType === 'female' || s.optionType === 'both';
    const isMale   = s.optionType === 'male'   || s.optionType === 'both';
    const isBoth   = s.optionType === 'both';

    const photoSec = (title, imgs, cls) => {
      if (!imgs || imgs.length === 0) return '';
      return `<div class="salon-section">
        <div class="salon-sec-title ${cls}">${title}（${imgs.length}枚）</div>
        <div class="salon-photos">${imgs.map(u => `<div class="salon-photo" onclick="openLightbox('${u}')"><img src="${u}" referrerpolicy="no-referrer" onerror="this.style.display='none'"></div>`).join('')}</div>
      </div>`;
    };

    let body = `<div class="salon-section">
      <div class="salon-sec-title common">基本情報</div>
      <div class="salon-grid">
        <div><div class="salon-fl">オプション</div><div class="salon-fv">${optionLabel(s.optionType)}</div></div>
        <div><div class="salon-fl">撮影日</div><div class="salon-fv">${fmtDate(s.shootDate)}</div></div>
        ${isBoth ? `<div><div class="salon-fl">男性のお名前</div><div class="salon-fv">${s.nameMale||''}</div></div>` : ''}
      </div>
    </div>`;

    if (isFemale) {
      body += `<div class="salon-section">
        <div class="salon-sec-title female">👩 女性ヘア</div>
        <div class="salon-grid">
          <div><div class="salon-fl">髪の長さ</div><div class="salon-fv">${s.fHairLength||''}</div></div>
          <div><div class="salon-fl">パーマ</div><div class="salon-fv">${s.fPerm||''}</div></div>
          <div><div class="salon-fl">毛量</div><div class="salon-fv">${s.fHairVolume||''}</div></div>
          <div><div class="salon-fl">髪質</div><div class="salon-fv">${s.fHairTexture||''}</div></div>
        </div>
      </div>
      <div class="salon-section">
        <div class="salon-sec-title female">👩 女性メイク</div>
        <div class="salon-grid">
          <div><div class="salon-fl">肌質</div><div class="salon-fv">${s.fSkinType||''}</div></div>
          <div><div class="salon-fl">コンタクト</div><div class="salon-fv">${s.fContact||''}</div></div>
          <div><div class="salon-fl">メイクイメージ</div><div class="salon-fv">${s.fMakeupImage||''}</div></div>
          ${s.fAllergyCosm ? `<div><div class="salon-fl">肌荒れする化粧品</div><div class="salon-fv">${s.fAllergyCosm}</div></div>` : ''}
        </div>
      </div>
      ${photoSec('ヘアセットイメージ写真', s.fHairImages, 'female')}
      ${photoSec('メイクイメージ写真', s.fMakeupImages, 'female')}
      ${photoSec('髪の長さがわかる写真', s.fLengthImages, 'female')}`;
    }

    if (isMale) {
      body += `<div class="salon-section">
        <div class="salon-sec-title male">👨 男性ヘア</div>
        <div class="salon-grid">
          <div><div class="salon-fl">髪の長さ</div><div class="salon-fv">${s.mHairLength||''}</div></div>
          <div><div class="salon-fl">パーマ</div><div class="salon-fv">${s.mPerm||''}</div></div>
          <div><div class="salon-fl">毛量</div><div class="salon-fv">${s.mHairVolume||''}</div></div>
          <div><div class="salon-fl">髪質</div><div class="salon-fv">${s.mHairTexture||''}</div></div>
        </div>
      </div>
      ${photoSec('ヘアセットイメージ写真', s.mHairImages, 'male')}
      ${photoSec('髪の長さがわかる写真', s.mLengthImages, 'male')}`;
    }

    if (s.memo) {
      body += `<div class="salon-section">
        <div class="salon-sec-title common">補足メモ</div>
        <div style="font-size:13px;line-height:1.8">${s.memo}</div>
      </div>`;
    }

    wrap.innerHTML = `<div class="salon-card">
      <div class="salon-head">
        <div class="salon-name">${s.name} 様</div>
        <div class="salon-meta">撮影日：${fmtDate(s.shootDate)}　／　回答日時：${fmtDateTime(s.submittedAt)}</div>
      </div>
      <div class="salon-body">${body}</div>
    </div>`;
  } catch(err) {
    wrap.innerHTML = '<p style="text-align:center;padding:60px 0;color:var(--muted);font-size:14px">このURLは無効か、読み込みに失敗しました。</p>';
  }
}

// ============================================================
// HELPERS
// ============================================================
function fmtDate(str) {
  if (!str) return '';
  try {
    const d = new Date(str);
    if (!isNaN(d)) return d.toLocaleDateString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Tokyo'});
  } catch(e) {}
  return str.slice(0,10);
}
function fmtDateTime(str) {
  if (!str) return '';
  if (!str.includes('GMT')) return str;
  try {
    const d = new Date(str);
    if (!isNaN(d)) return d.toLocaleString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tokyo'});
  } catch(e) {}
  return str;
}
function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
</script>
